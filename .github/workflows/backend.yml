name: Backend Sprint 2
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avixsoft
          POSTGRES_PASSWORD: test
          POSTGRES_DB: avixsoft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avixsoft -d avixsoft_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://avixsoft:test@localhost:5432/avixsoft_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: database
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: database
      - run: npm run typecheck
        working-directory: backend
      # tsconfig.json excluye tests/, así que el typecheck de arriba no los ve:
      # hace falta el segundo para que un error en los tests no llegue a main.
      - run: npm run typecheck:tests
        working-directory: backend
      # Suite de node:test que trae upstream (test/operaciones.test.ts).
      - run: npm test
        working-directory: backend
      # Suite de Jest (tests/**/*.test.ts): unitarios de controladores,
      # servicios y API, con la capa de datos aislada.
      - run: npm run test:jest:coverage
        working-directory: backend
      # Integración contra el Postgres del service de arriba.
      - run: npm run test:integration
        working-directory: backend
        env:
          TEST_DATABASE_SYNC: 'true'
